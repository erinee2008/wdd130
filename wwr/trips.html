<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>River Trips - White Water Rafting Company</title>
    <meta name="description"
      content="Explore our white water rafting trips ranging from Class 2 to Class 6 rapids.">
    <meta name="author" content="Erin Fulks">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting Logo">
        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/backgroud.jpg" alt="Rafting Trip Hero">
            <h1 class="hero-title">Our River Trips</h1>
        </div>

        <section class="cta-section">
            <h2>Book Your Adventure</h2>
            <p>Ready to hit the water? Contact us today to reserve your spot on one of our legendary
                guided tours.</p>
            <a href="contact.html" class="book-button">Contact Us to Book</a>
        </section>

        <section class="trips-grid">
            <h2>Available Adventures</h2>
            <div class="trip-cards">
                <figure>
                    <img src="images/class2.png" alt="Class 2 Rapids">
                    <figcaption>
                        <h3>The Family Float (Class 2)</h3>
                        <p>Perfect for beginners and families with young children.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/class3.png" alt="Class 3 Rapids">
                    <figcaption>
                        <h3>Main River Run (Class 3)</h3>
                        <p>A fun mix of splashes and beautiful canyon scenery.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/class4.png" alt="Class 4 Rapids">
                    <figcaption>
                        <h3>The Adrenaline Kick (Class 4)</h3>
                        <p>For those looking for a thrill and big waves.</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p> ©2026 🗻 White Water Rafting 🗻 Erin Fulks</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-logo.png"
                  alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin-logo.png"
                  alt="LinkedIn Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram-logo.jpg"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
